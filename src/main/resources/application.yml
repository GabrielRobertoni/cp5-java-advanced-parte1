# ==========================================================
#  Mercado Express - CP5 Java Advanced (Parte I)
#  Todos os valores sensíveis vêm de variáveis de ambiente.
#  Os valores após ":" são padrões para rodar localmente.
# ==========================================================
server:
  # O Render (e outras plataformas) informam a porta pela variável PORT
  port: ${PORT:8080}
  # Atrás do proxy HTTPS da plataforma de deploy, respeita X-Forwarded-Proto/Host
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 30m
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: mercado-express-security

  # Banco PostgreSQL (configuração básica pedida no CP5)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mercado_express}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    # As tabelas são criadas pelo Flyway; o Hibernate apenas valida o mapeamento
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  thymeleaf:
    cache: true

  # Permite PUT/DELETE em formulários HTML (campo oculto _method gerado pelo Thymeleaf)
  mvc:
    hiddenmethod:
      filter:
        enabled: true

# Usuários criados automaticamente na primeira execução (se ainda não existirem)
app:
  admin:
    nome: ${ADMIN_NAME:Gerente Mercado Express}
    email: ${ADMIN_EMAIL:admin@mercadoexpress.com}
    senha: ${ADMIN_PASSWORD:Admin@123}
  demo-cliente:
    criar: ${DEMO_CLIENTE_ENABLED:true}
    nome: Cliente Demonstração
    email: ${DEMO_CLIENTE_EMAIL:cliente@mercadoexpress.com}
    senha: ${DEMO_CLIENTE_PASSWORD:Cliente@123}

logging:
  level:
    root: INFO
    br.com.fiap.mercadoexpress: INFO
